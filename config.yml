# Directory of the host genome index for STAR

genome_dir: "../../refs/human/STAR"

# Directory of the viral database in fasta format

virus_fasta: "../../refs/virus/virus.fa"

# Directory of the viral database in mmi format (for minimap2)

virus_db: "../../refs/virus/virus.mmi"

# Directory of the host genome in mmi format (for minimap2)

human_minimap: "../../refs/human/human.mmi"

# Number of cores to use

cores: "4"

# kmer sizes to be used in the rnaspades de novo assembly
# Should be a string of the kmer sizes separated by commas

kmers: "31,53,75,91,115"
